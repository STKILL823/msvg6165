<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>PhpMyTech — Авторизация</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="login-shell">
      <header class="brand" aria-labelledby="brand-name">
        <svg class="sailboat" viewBox="0 0 120 100" aria-hidden="true">
          <path d="M60 4 58 77 25 77Z" fill="#d7d9dc"/>
          <path d="M63 4 66 77 102 77Z" fill="#c7c9cc"/>
          <path d="M65 20 66 77 84 77Z" fill="#adb0b4"/>
          <path d="M18 80c25 8 57 8 88 0-8 14-24 20-44 20S26 94 18 80Z" fill="#9da1a6"/>
        </svg>
        <div id="brand-name" class="wordmark"><span>php</span><strong>MyTech</strong></div>
        <h1 data-i18n="welcome">Добро пожаловать в технический отдел 61-65</h1>
      </header>

      <section class="panel language-panel" aria-labelledby="language-title">
        <h2 id="language-title" data-i18n="languageTitle">Язык — Language</h2>
        <label class="sr-only" for="language" data-i18n="languageLabel">Выберите язык</label>
        <select id="language" name="language">
          <option value="ru">Русский — Russian</option>
          <option value="en">English — Английский</option>
          <option value="uk">Українська — Ukrainian</option>
          <option value="de">Deutsch — German</option>
          <option value="fr">Français — French</option>
        </select>
      </section>

      <section class="panel auth-panel" aria-labelledby="auth-title">
        <h2 id="auth-title" data-i18n="authorization">Авторизация</h2>
        <form id="login-form" autocomplete="on">
          <div class="field-row">
            <label for="username" data-i18n="username">Nick_Name:</label>
            <input id="username" name="username" type="text" autocomplete="username" maxlength="80" required autofocus>
          </div>
          <div class="field-row">
            <label for="password" data-i18n="password">Пароль:</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
          </div>
          <p id="message" class="message" role="alert" aria-live="polite"></p>
          <div class="form-footer">
            <button id="submit-button" type="submit">
              <span data-i18n="signIn">Войти</span>
              <span aria-hidden="true">→</span>
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
