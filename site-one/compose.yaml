services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-phpmytech}
      MARIADB_USER: ${DB_USER:-phpmytech}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - phpmytech_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8080:80"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-phpmytech}
      DB_USER: ${DB_USER:-phpmytech}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BOOTSTRAP_SUPERADMIN_USERNAME: ${BOOTSTRAP_SUPERADMIN_USERNAME:?Set BOOTSTRAP_SUPERADMIN_USERNAME in .env}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      BOOTSTRAP_SUPERADMIN_PASSWORD_HASH: ${BOOTSTRAP_SUPERADMIN_PASSWORD_HASH:-}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  phpmytech_db:
